<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<meta name="description" content="Eternal Horizon — animated tropical night beach">
<link rel="manifest" href="./manifest.webmanifest">
<title>Eternal Horizon</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#f8fafc}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;z-index:3;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);pointer-events:none}
.panel{pointer-events:auto;position:absolute;right:12px;top:12px;width:min(360px,calc(100vw - 24px));max-height:calc(100% - 24px);overflow:auto;padding:15px;border:1px solid #38bdf855;border-radius:16px;background:#07101eec;box-shadow:0 12px 36px #0009;display:none}
.panel.open{display:block}.heading{color:#7dd3fc;font-weight:750;font-size:15px}.muted{color:#aab9ca;font-size:12px;line-height:1.45}
button,select,input{font:inherit}button{border:0;border-radius:11px;padding:10px 12px;background:#087db8;color:white;font-weight:650;cursor:pointer}
button.secondary{background:transparent;color:#cbd5e1;text-decoration:underline;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
.row{margin:11px 0}.row label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#d7e2ef;margin-bottom:5px}.row input[type=range]{width:100%;accent-color:#38bdf8}
select{width:100%;padding:8px;background:#1e293b;color:white;border:1px solid #475569;border-radius:8px}
#setup{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(390px,calc(100vw - 28px));padding:16px;border:1px solid #38bdf866;border-radius:17px;background:#07101ef2;text-align:center;box-shadow:0 12px 36px #000b;pointer-events:auto}
#setup h2{margin:0 0 6px;color:#7dd3fc;font-size:16px}#setup p{font-size:12px;line-height:1.5;color:#cbd5e1;margin:0 0 12px}
#setup button{width:100%;margin-bottom:7px}#photoInput{display:none}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100vw - 24px);padding:8px 12px;border-radius:10px;background:#07101ebd;color:#dbeafe;font-size:11px;text-align:center;pointer-events:none}
#status{font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;padding:9px;background:#0f172a;border-radius:9px;overflow-wrap:anywhere}
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated tropical beach scene"></canvas>
<div id="ui">
  <div id="hint">Double-tap the scene to open settings</div>
  <section id="setup">
    <h2>Eternal Horizon</h2>
    <p>Choose the Night Beach photo first and the Milky Way photo second. Photos are saved in this browser on this device. Or continue with the generated scene.</p>
    <input id="photoInput" type="file" accept="image/*" multiple>
    <button id="choosePhotos">Choose 2 reference photos</button>
    <button id="useGenerated" class="secondary">Use generated beach</button>
  </section>
  <section id="panel" class="panel" aria-label="Scene settings">
    <div class="heading">ETERNAL HORIZON</div>
    <div class="muted">Double-tap outside this panel to close it.</div>
    <div id="status" class="row">Starting graphics…</div>
    <div class="row"><label><span>Use local time</span><input id="realTime" type="checkbox" checked></label></div>
    <div class="row"><label><span>Manual time</span><span id="timeLabel">22:00</span></label><input id="time" type="range" min="0" max="23.99" step=".02" value="22"></div>
    <div class="row"><label><span>Animation speed</span><span id="speedLabel">1×</span></label><input id="speed" type="range" min="1" max="60" value="1"></div>
    <div class="row"><label><span>Pause animation</span><input id="paused" type="checkbox"></label></div>
    <div class="row"><label><span>Star density</span><span id="starsLabel">1.0</span></label><input id="stars" type="range" min="0" max="1.5" step=".1" value="1"></div>
    <div class="row"><label><span>Ocean waves</span><span id="wavesLabel">1.0</span></label><input id="waves" type="range" min="0" max="1.5" step=".1" value="1"></div>
    <div class="row"><label><span>Moon phase</span><span id="phaseLabel">0.35</span></label><input id="phase" type="range" min="0" max="1" step=".01" value=".35"></div>
    <div class="row"><label><span>Rendering quality</span></label><select id="quality"><option value=".65">Battery saver</option><option value="1" selected>Balanced</option><option value="1.35">High (may heat phone)</option></select></div>
    <button id="changePhotos">Change reference photos</button>
  </section>
</div>
<script>
(() => {
'use strict';
const canvas = document.querySelector('#scene');
const setup = document.querySelector('#setup');
const panel = document.querySelector('#panel');
const statusBox = document.querySelector('#status');
const photoInput = document.querySelector('#photoInput');
const $ = id => document.getElementById(id);
let gl = null, program = null, textures = [], imageReady = 0, lastFrame = 0, elapsed = 0, lastTap = 0;
let images = [null, null], db = null, failed = false;

const vertexSource = `#version 300 es
in vec2 aPosition; out vec2 vUv;
void main(){vUv=aPosition*.5+.5;gl_Position=vec4(aPosition,0.,1.);}`;

const fragmentSource = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 fragColor;
uniform vec2 uResolution; uniform float uTime; uniform float uHour;
uniform float uStars; uniform float uWaves; uniform float uPhase;
uniform sampler2D uBeach; uniform sampler2D uGalaxy; uniform float uHasPhotos;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
void main(){
 float aspect=uResolution.x/max(uResolution.y,1.);
 vec2 uv=vUv;
 float horizon=.475;
 float day=max(0.,min(1.,(sin((uHour-6.)*3.14159/12.)+.05)*.75));
 float night=1.-day;
 vec3 sky=mix(vec3(.025,.055,.12),vec3(.10,.26,.44),pow(max(0.,uv.y-horizon)/(1.-horizon),.7));
 vec3 dawn=mix(vec3(.34,.12,.18),vec3(.95,.43,.19),pow(max(0.,uv.y-horizon)/(1.-horizon),.65));
 sky=mix(sky,dawn,clamp(1.-abs(uHour-6.)/2.,0.,1.)*.8+clamp(1.-abs(uHour-18.)/2.,0.,1.)*.8);
 sky=mix(sky,vec3(.42,.70,.91),day*.8);
 float ocean=1.-smoothstep(horizon-.015,horizon+.01,uv.y);
 float sandEdge=.24+(horizon-uv.y)*1.55;
 vec3 sand=mix(vec3(.39,.34,.28),vec3(.17,.22,.25),smoothstep(sandEdge-.12,sandEdge+.1,uv.x));
 vec3 sea=mix(vec3(.015,.10,.17),vec3(.03,.30,.34),smoothstep(0.,sandEdge,uv.x));
 vec3 col=uv.y>horizon?sky:mix(sand,sea,step(uv.x,sandEdge));
 if(uHasPhotos>.5){
   vec2 tuv=vec2(clamp(uv.x,.001,.999),clamp(1.-uv.y,.001,.999));
   vec3 beach=texture(uBeach,tuv).rgb;
   vec3 galaxy=texture(uGalaxy,tuv).rgb;
   float skyMask=smoothstep(horizon-.02,horizon+.03,uv.y);
   col=mix(col,beach,.78);
   col=mix(col,galaxy,skyMask*night*.75);
 }
 // stars, suppressed during daylight
 vec2 cell=floor(uv*vec2(190.,330.));
 float st=hash(cell);
 if(st>.991 && uv.y>horizon) col+=vec3(.72,.84,1.)*night*uStars*(.5+.5*sin(uTime*2.+st*80.));
 // moon, approximate phase shading
 vec2 md=(uv-vec2(.5,.72))*vec2(aspect,1.);
 float r=length(md);
 if(r<.033 && uv.y>horizon){
   float z=sqrt(max(0.,1.-dot(md/.033,md/.033)));
   float lit=step(md.x,(uPhase-.5)*.065);
   col=mix(col,vec3(.78,.83,.88)*(.35+.65*lit)*z,1.);
 }
 // ocean ripples and central moon/sun path
 if(ocean>.5){
   float ripple=sin(uv.y*170.+uTime*2.2+sin(uv.x*40.)*2.)*.5+.5;
   float path=exp(-pow((uv.x-.5)/(0.018+(horizon-uv.y)*.18),2.));
   col+=vec3(.22,.43,.48)*ripple*uWaves*.18;
   col+=vec3(1.,.78,.53)*path*(.10+.22*day)*ocean;
 }
 // palm silhouettes on right
 float px=(uv.x-.78)+.08*(uv.y-.62);
 float trunk=abs(px-.025*sin((.78-uv.y)*5.))<.009 && uv.y<.73 && uv.y>.28;
 float leaves=0.;
 for(int i=0;i<5;i++){float a=float(i)*.48-1.0;vec2 p=uv-vec2(.82,.70);float line=abs(p.y-(.70+a*(p.x))-.12*sin(p.x*8.+float(i)))*1.0;leaves=max(leaves,1.-smoothstep(.005,.018,line));}
 col=mix(col,vec3(.008,.018,.025),max(float(trunk),leaves*.75));
 col=col/(1.+col*.18);
 fragColor=vec4(clamp(col,0.,1.),1.);
}`;

function shader(type, source){
 const s=gl.createShader(type); gl.shaderSource(s,source); gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const msg=gl.getShaderInfoLog(s)||'Unknown shader error';gl.deleteShader(s);throw new Error(msg);}
 return s;
}
function initGL(){
 gl=canvas.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});
 if(!gl) throw new Error('WebGL2 is unavailable. Update Chrome or use a browser/device with WebGL2 support.');
 const vs=shader(gl.VERTEX_SHADER,vertexSource), fs=shader(gl.FRAGMENT_SHADER,fragmentSource);
 program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error('Shader link failed: '+gl.getProgramInfoLog(program));
 gl.deleteShader(vs);gl.deleteShader(fs);
 gl.useProgram(program);
 const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(program,'aPosition');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 textures=[makeTexture(),makeTexture()];
 gl.uniform1i(gl.getUniformLocation(program,'uBeach'),0);
 gl.uniform1i(gl.getUniformLocation(program,'uGalaxy'),1);
}
function makeTexture(){
 const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([20,30,45,255]));
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 return t;
}
function uploadImage(index,img){
 if(!gl || !img) return;
 gl.bindTexture(gl.TEXTURE_2D,textures[index]);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 images[index]=img;
 imageReady=images.filter(Boolean).length;
 if(imageReady===2) setup.style.display='none';
}
function openDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)) return reject(new Error('This browser does not support photo storage.'));
  const req=indexedDB.open('EternalHorizonMobile',1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos');};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function savePhoto(key,blob){
 const database=db||await openDB();db=database;
 return new Promise((resolve,reject)=>{const tx=database.transaction('photos','readwrite');tx.objectStore('photos').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
}
async function getPhoto(key){
 const database=db||await openDB();db=database;
 return new Promise((resolve,reject)=>{const tx=database.transaction('photos','readonly');const req=tx.objectStore('photos').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});
}
async function blobToImage(blob){return createImageBitmap(blob);}
async function restorePhotos(){
 try{
  const b=await getPhoto('beach'),g=await getPhoto('galaxy');
  if(b&&g){uploadImage(0,await blobToImage(b));uploadImage(1,await blobToImage(g));}
 }catch(e){console.warn('Saved photos could not be restored:',e);}
}
$('choosePhotos').addEventListener('click',()=>photoInput.click());
$('changePhotos').addEventListener('click',()=>photoInput.click());
photoInput.addEventListener('change',async()=>{
 const files=Array.from(photoInput.files||[]).filter(f=>f.type.startsWith('image/'));
 if(files.length<2){statusBox.textContent='Please choose two images: Night Beach first, Milky Way second.';return;}
 try{
  for(let i=0;i<2;i++){const bitmap=await createImageBitmap(files[i]);uploadImage(i,bitmap);await savePhoto(i===0?'beach':'galaxy',files[i]);}
  setup.style.display='none';statusBox.textContent='Reference photos loaded and saved on this device.';
 }catch(e){statusBox.textContent='Photo error: '+e.message;}
 photoInput.value='';
});
$('useGenerated').addEventListener('click',()=>setup.style.display='none');
canvas.addEventListener('pointerdown',()=>{
 const now=performance.now();
 if(now-lastTap<330) panel.classList.toggle('open');
 lastTap=now;
});
$('panel').addEventListener('pointerdown',e=>e.stopPropagation());
$('stars').addEventListener('input',e=>$('starsLabel').textContent=Number(e.target.value).toFixed(1));
$('waves').addEventListener('input',e=>$('wavesLabel').textContent=Number(e.target.value).toFixed(1));
$('time').addEventListener('input',e=>{$('timeLabel').textContent=formatTime(Number(e.target.value));});
$('speed').addEventListener('input',e=>$('speedLabel').textContent=e.target.value+'×');
function formatTime(h){return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');}
function render(now){
 requestAnimationFrame(render);
 if(failed||!gl||!program)return;
 const q=Number($('quality').value);
 const dpr=Math.min(window.devicePixelRatio||1,q);
 const w=Math.max(1,Math.floor(innerWidth*dpr)),h=Math.max(1,Math.floor(innerHeight*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 gl.viewport(0,0,w,h);gl.useProgram(program);
 const paused=$('paused').checked;
 const dt=lastFrame?Math.min(.1,(now-lastFrame)/1000):0;lastFrame=now;
 if(!paused)elapsed+=dt*Number($('speed').value);
 const hour=$('realTime').checked?(new Date().getHours()+new Date().getMinutes()/60+new Date().getSeconds()/3600):(Number($('time').value)+(elapsed/3600))%24;
 $('timeLabel').textContent=formatTime(hour);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,textures[0]);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,textures[1]);
 gl.uniform2f(gl.getUniformLocation(program,'uResolution'),w,h);
 gl.uniform1f(gl.getUniformLocation(program,'uTime'),elapsed);
 gl.uniform1f(gl.getUniformLocation(program,'uHour'),hour);
 gl.uniform1f(gl.getUniformLocation(program,'uStars'),Number($('stars').value));
 gl.uniform1f(gl.getUniformLocation(program,'uWaves'),Number($('waves').value));
 gl.uniform1f(gl.getUniformLocation(program,'uPhase'),Number($('phase').value));
 gl.uniform1f(gl.getUniformLocation(program,'uHasPhotos'),imageReady===2?1:0);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 statusBox.textContent=`Graphics: WebGL2 OK\nResolution: ${w} × ${h}\nPhoto textures: ${imageReady}/2\nClock: ${formatTime(hour)}\nQuality scale: ${q}×`;
}
try{initGL();restorePhotos();requestAnimationFrame(render);}
catch(e){failed=true;statusBox.textContent='Graphics initialization failed: '+e.message;setup.style.display='block';}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();failed=true;statusBox.textContent='Graphics context lost. Reload the page to recover.';});
})();
</script>
</body>
</html>
