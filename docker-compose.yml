version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tripbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripbuddy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripbuddy_dev_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tripbuddy_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripbuddy_user} -d ${POSTGRES_DB:-tripbuddy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: tripbuddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: tripbuddy-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      USE_SQLITE_FALLBACK: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tripbuddy_user}:${POSTGRES_PASSWORD:-tripbuddy_dev_pass_change_me}@db:5432/${POSTGRES_DB:-tripbuddy_db}
      REDIS_URL: redis://redis:6379/0
      OPERATING_MODE: ${OPERATING_MODE:-demo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: tripbuddy-worker
    restart: unless-stopped
    command: ["python3", "-m", "app.workers.runner"]
    env_file:
      - .env.example
    environment:
      USE_SQLITE_FALLBACK: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tripbuddy_user}:${POSTGRES_PASSWORD:-tripbuddy_dev_pass_change_me}@db:5432/${POSTGRES_DB:-tripbuddy_db}
      REDIS_URL: redis://redis:6379/0
      OPERATING_MODE: ${OPERATING_MODE:-demo}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: tripbuddy-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
